name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  bats-macos:
    name: bats-core (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node.js dependencies and run CLI tests
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      - name: Install bats-core
        run: brew install bats-core

      - name: Run tests
        run: bats tests/
